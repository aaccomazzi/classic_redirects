# Sample nginx configuration for the ADS Classic -> SciX redirector.
#
# nginx has no built-in CGI support, so the handler runs through fcgiwrap
# (Debian/Ubuntu: `apt install fcgiwrap`; the socket is /run/fcgiwrap.socket).
# fcgiwrap exports every fastcgi_param to the script as an environment
# variable, which is how SCIX_ENV reaches legacy_handler.
#
# There is no content left to serve: every request goes to the handler,
# which answers with a 301 (mapped), 302 (unmapped htdocs document -> SciX
# home) or 404 (unmapped cgi-bin script).

server {
    listen 80;
    listen 443 ssl;
    server_name adsabs.harvard.edu www.adsabs.harvard.edu articles.adsabs.harvard.edu;

    # ssl_certificate     /etc/ssl/...;
    # ssl_certificate_key /etc/ssl/...;

    # Optional: keep answering robots.txt locally instead of redirecting it
    # location = /robots.txt { root /srv/classic_redirects/static; }

    location / {
        include fastcgi_params;          # REQUEST_URI, QUERY_STRING, REQUEST_METHOD, CONTENT_LENGTH, ...
        fastcgi_param SCRIPT_FILENAME /srv/classic_redirects/cgi-bin/legacy_handler;
        fastcgi_param SCRIPT_NAME     /cgi-bin/legacy_handler;
        fastcgi_param SCIX_ENV        prod;   # "dev" -> https://dev.scixplorer.org
        fastcgi_pass  unix:/run/fcgiwrap.socket;
    }
}
